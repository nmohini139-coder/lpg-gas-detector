<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPG Gas Detector</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2f7, #dce6f2);
      text-align: center;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: #222;
      color: white;
      padding: 25px;
      animation: slideDown 0.8s ease;
    }

    .header h1 {
      margin: 0;
      animation: titleGlow 2s infinite;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      animation: fadeIn 1s ease;
    }

    /* CARD */
    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    /* STATUS */
    #status {
      font-size: 30px;
      font-weight: bold;
      margin: 20px;
      transition: 0.3s;
    }

    .safe {
      color: green;
      animation: safeGlow 2s infinite;
    }

    .danger {
      color: red;
      animation: dangerBlink 0.6s infinite;
    }

    /* GAS VALUE */
    .gas {
      font-size: 32px;
      font-weight: bold;
      margin: 20px;
      transition: 0.3s;
    }

    #gasValue {
      display: inline-block;
      animation: numberPulse 1.5s infinite;
    }

    /* GAS BAR */
    .gasBarContainer {
      width: 90%;
      height: 25px;
      background: #ddd;
      border-radius: 20px;
      margin: 20px auto;
      overflow: hidden;
    }

    #gasBar {
      height: 100%;
      width: 10%;
      background: green;
      border-radius: 20px;
      transition: width 0.5s ease, background 0.5s ease;
    }

    /* INFORMATION */
    .info {
      font-size: 18px;
      margin: 12px;
      padding: 10px;
      background: #f7f7f7;
      border-radius: 8px;
      transition: 0.3s;
    }

    .info:hover {
      transform: scale(1.03);
      background: #eeeeee;
    }

    /* BUTTONS */
    button {
      width: 90%;
      padding: 15px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    button:active {
      transform: scale(0.95);
    }

    .sms {
      background: #2196F3;
      color: white;
    }

    .call {
      background: #4CAF50;
      color: white;
    }

    /* ANIMATIONS */

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideDown {
      from {
        transform: translateY(-100%);
      }
      to {
        transform: translateY(0);
      }
    }

    @keyframes titleGlow {
      0%, 100% {
        text-shadow: 0 0 5px white;
      }
      50% {
        text-shadow: 0 0 20px orange;
      }
    }

    @keyframes safeGlow {
      0%, 100% {
        transform: scale(1);
        text-shadow: 0 0 5px green;
      }
      50% {
        transform: scale(1.05);
        text-shadow: 0 0 20px green;
      }
    }

    @keyframes dangerBlink {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.3;
        transform: scale(1.08);
      }
    }

    @keyframes numberPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }

    /* DANGER CARD */
    .dangerCard {
      animation: dangerCardAnimation 0.7s infinite;
    }

    @keyframes dangerCardAnimation {
      0%, 100% {
        box-shadow: 0 4px 15px rgba(255,0,0,0.2);
      }
      50% {
        box-shadow: 0 4px 30px rgba(255,0,0,0.8);
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🔥 LPG GAS DETECTOR</h1>
    <p>Smart Gas Safety System</p>
  </div>

  <div class="container">

    <div class="card" id="mainCard">

      <div id="status" class="safe">
        🟢 SAFE
      </div>

      <div class="gas">
        Gas Level: <span id="gasValue">39</span>
      </div>

      <!-- GAS BAR -->
      <div class="gasBarContainer">
        <div id="gasBar"></div>
      </div>

      <div class="info">
        🔊 Buzzer: <b id="buzzer">OFF</b>
      </div>

      <div class="info">
        🔴 Red LED: <b id="red">OFF</b>
      </div>

      <div class="info">
        🟢 Green LED: <b id="green">ON</b>
      </div>

      <div class="info">
        ⚙️ Servo: <b id="servo">0°</b>
      </div>

      <button class="sms" onclick="sendSMS()">
        💬 SEND SMS
      </button>

      <button class="call" onclick="makeCall()">
        📞 CALL
      </button>

      <button
        class="call"
        onclick="connectArduino()"
        style="background-color:#28a745;color:white;">
        🔌 CONNECT ARDUINO
      </button>

      <p id="statusText"
         style="font-size:13px;color:#666;margin-top:5px;">
        Status: Disconnected
      </p>

    </div>

  </div>


  <script>

    /* SMS */
    function sendSMS() {
      alert("SMS system will be connected in the next step.");
    }


    /* CALL */
    function makeCall() {
      alert("Call system will be connected in the next step.");
    }


    /* ARDUINO SERIAL */

    let port;
    let reader;
    let isConnected = false;


    async function connectArduino() {

      const status = document.getElementById("statusText");

      if (!("serial" in navigator)) {

        alert(
          "Aapka browser Web Serial API support nahi karta! Google Chrome ya Edge use karein."
        );

        return;
      }


      if (!isConnected) {

        try {

          port = await navigator.serial.requestPort();

          await port.open({
            baudRate: 9600
          });

          isConnected = true;

          status.innerText = "Status: Connected via USB";

          readSerialData();

        }

        catch (err) {

          status.innerText =
            "Status: Connection Failed / Cancelled";

        }

      }

      else {

        if (reader)
          await reader.cancel();

        if (port)
          await port.close();

        isConnected = false;

        status.innerText =
          "Status: Disconnected";
      }
    }


    /* READ ARDUINO */

    async function readSerialData() {

      const decoder = new TextDecoderStream();

      const inputDone =
        port.readable.pipeTo(decoder.writable);

      const inputStream =
        decoder.readable;

      reader =
        inputStream.getReader();

      let buffer = "";


      try {

        while (true) {

          const { value, done } =
            await reader.read();

          if (done) {

            reader.releaseLock();

            break;
          }


          if (value) {

            buffer += value;

            let lines =
              buffer.split("\n");

            buffer =
              lines.pop();


            for (let line of lines) {

              let trimmedVal =
                line.trim();


              if (
                trimmedVal !== "" &&
                !isNaN(trimmedVal)
              ) {

                updateGas(
                  Number(trimmedVal)
                );

              }
            }
          }
        }

      }

      catch (err) {

        console.error(
          "Read Error:",
          err
        );
      }
    }


    /* GAS ANIMATION */

    function updateGas(value) {

      const gasValue =
        document.getElementById("gasValue");

      const gasBar =
        document.getElementById("gasBar");

      const status =
        document.getElementById("status");

      const card =
        document.getElementById("mainCard");


      gasValue.innerText = value;


      /*
        Convert sensor value to
        percentage.

        Maximum = 1023
      */

      let percentage =
        (value / 1023) * 100;


      if (percentage > 100)
        percentage = 100;


      gasBar.style.width =
        percentage + "%";


      /* GAS LEVEL */

      if (value >= 300) {

        /* DANGER */

        gasBar.style.background =
          "red";

        status.innerHTML =
          "🔴 LPG GAS DETECTED!";

        status.className =
          "danger";

        card.classList.add(
          "dangerCard"
        );


        document.getElementById(
          "buzzer"
        ).innerText = "ON";


        document.getElementById(
          "red"
        ).innerText = "ON";


        document.getElementById(
          "green"
        ).innerText = "OFF";


        document.getElementById(
          "servo"
        ).innerText = "180°";

      }

      else {

        /* SAFE */

        gasBar.style.background =
          "green";

        status.innerHTML =
          "🟢 SAFE";

        status.className =
          "safe";

        card.classList.remove(
          "dangerCard"
        );


        document.getElementById(
          "buzzer"
        ).innerText = "OFF";


        document.getElementById(
          "red"
        ).innerText = "OFF";


        document.getElementById(
          "green"
        ).innerText = "ON";


        document.getElementById(
          "servo"
        ).innerText = "0°";
      }
    }


    /* START WITH CURRENT VALUE */

    updateGas(39);

  </script>

</body>
</html>
