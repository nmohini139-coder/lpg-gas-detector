<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPG Gas Detector</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      text-align: center;
    }

    .header {
      background: #222;
      color: white;
      padding: 25px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    #status {
      font-size: 30px;
      font-weight: bold;
      margin: 20px;
    }

    .safe {
      color: green;
    }

    .danger {
      color: red;
    }

    .gas {
      font-size: 40px;
      font-weight: bold;
      margin: 20px;
    }

    .info {
      font-size: 18px;
      margin: 12px;
    }

    button {
      width: 90%;
      padding: 15px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    .sms {
      background: #2196F3;
      color: white;
    }

    .call {
      background: #4CAF50;
      color: white;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🔥 LPG GAS DETECTOR</h1>
    <p>Smart Gas Safety System</p>
  </div>

  <div class="container">

    <div class="card">

      <div id="status" class="safe">
        🟢 SAFE
      </div>

      <div class="gas">
        Gas Level: <span id="gasValue">39</span>
      </div>

      <div class="info">
        🔊 Buzzer: <b id="buzzer">OFF</b>
      </div>

      <div class="info">
        🔴 Red LED: <b id="red">OFF</b>
      </div>

      <div class="info">
        🟢 Green LED: <b id="green">ON</b>
      </div>

      <div class="info">
        ⚙️ Servo: <b id="servo">0°</b>
      </div>

      <button class="sms" onclick="sendSMS()">
        💬 SEND SMS
      </button>

      <button class="call" onclick="makeCall()">
        📞 CALL
      </button>
<button class="call" onclick="connectArduino()" style="background-color: #28a745; color: white;">
  🔌 CONNECT ARDUINO
</button>
<p id="statusText" style="font-size: 13px; color: #666; margin-top: 5px;">Status: Disconnected</p>
    </div>

  </div>

  <script>

    function sendSMS() {
      alert("SMS system will be connected in the next step.");
    }
let port;
let reader;
let isConnected = false;

async function connectArduino() {
  const status = document.getElementById("statusText");

  if (!("serial" in navigator)) {
    alert("Aapka browser Web Serial API support nahi karta! Google Chrome ya Edge use karein.");
    return;
  }

  if (!isConnected) {
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 9600 });
      isConnected = true;
      status.innerText = "Status: Connected via USB";
      readSerialData();
    } catch (err) {
      status.innerText = "Status: Connection Failed / Cancelled";
    }
  } else {
    if (reader) await reader.cancel();
    if (port) await port.close();
    isConnected = false;
    status.innerText = "Status: Disconnected";
  }
}

async function readSerialData() {
  const decoder = new TextDecoderStream();
  const inputDone = port.readable.pipeTo(decoder.writable);
  const inputStream = decoder.readable;
  reader = inputStream.getReader();
  let buffer = "";

  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) { reader.releaseLock(); break; }
      if (value) {
        buffer += value;
        let lines = buffer.split("\n");
        buffer = lines.pop();
        for (let line of lines) {
          let trimmedVal = line.trim();
          if (trimmedVal !== "" && !isNaN(trimmedVal)) {
            let gasElem = document.getElementById("gasValue");
            if (gasElem) gasElem.innerText = trimmedVal;
          }
        }
      }
    }
  } catch (err) {
    console.error("Read Error:", err);
  }
}
    function makeCall() {
      alert("Call system will be connected in the next step.");
    }

  </script>

</body>
</html>
