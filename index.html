<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPG Gas Detector Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #333;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      color: white;
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      animation: slideDown 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 1px;
      animation: titleGlow 3s infinite alternate;
    }

    .header p {
      margin: 5px 0 0;
      opacity: 0.8;
      font-size: 13px;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 460px;
      width: 92%;
      margin: 20px auto;
      padding: 5px;
      animation: fadeInUp 0.9s ease-out;
    }

    /* CARD */
    .card {
      background: rgba(255, 255, 255, 0.96);
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      transition: all 0.4s ease;
      position: relative;
    }

    /* LIVE DISPLAY BAR */
    .live-display-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding: 8px 14px;
      background: #f0f4f8;
      border-radius: 10px;
    }

    .live-status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 13px;
      color: #0288d1;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #00E676;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(0, 230, 118, 0.4);
      animation: pulse 1.5s infinite;
    }

    .fullscreen-btn {
      width: auto !important;
      padding: 5px 10px !important;
      font-size: 12px !important;
      background: #333 !important;
      color: white !important;
      border-radius: 6px !important;
      margin: 0 !important;
    }

    /* STATUS */
    #status {
      font-size: 24px;
      font-weight: 800;
      margin: 12px 0;
      padding: 10px;
      border-radius: 12px;
      transition: all 0.4s ease;
    }

    .safe {
      color: #2e7d32;
      background: rgba(76, 175, 80, 0.12);
      animation: safeGlow 2.5s infinite;
    }

    .danger {
      color: #d32f2f;
      background: rgba(244, 67, 54, 0.15);
      animation: dangerBlink 0.5s infinite alternate;
    }

    /* GAS VALUE */
    .gas {
      font-size: 22px;
      font-weight: 700;
      color: #444;
      margin: 10px 0;
    }

    #gasValue {
      display: inline-block;
      font-size: 36px;
      color: #111;
      font-weight: 900;
      animation: numberPulse 2s infinite ease-in-out;
    }

    /* GAS BAR */
    .gasBarContainer {
      width: 100%;
      height: 22px;
      background: #e0e0e0;
      border-radius: 20px;
      margin: 15px 0;
      overflow: hidden;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
      padding: 3px;
    }

    #gasBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4caf50, #81c784);
      border-radius: 15px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s ease;
      box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
    }

    /* INFO GRID */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 15px 0;
    }

    .info {
      font-size: 14px;
      font-weight: 600;
      padding: 10px 8px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .info:hover {
      transform: translateY(-2px);
      background: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    /* BUTTONS */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    button:active {
      transform: scale(0.98);
    }

    .sms { background: linear-gradient(135deg, #2196F3, #1e88e5); color: white; }
    .call { background: linear-gradient(135deg, #4CAF50, #43a047); color: white; }
    .connect-btn { background: linear-gradient(135deg, #ff9800, #fb8c00); color: white; }

    .last-updated {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
      font-weight: 500;
    }

    /* ANIMATION KEYFRAMES */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      from { transform: translateY(-100%); }
      to { transform: translateY(0); }
    }

    @keyframes titleGlow {
      0% { text-shadow: 0 0 5px rgba(255,255,255,0.2); }
      100% { text-shadow: 0 0 18px rgba(255, 152, 0, 0.8); }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(0, 230, 118, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
    }

    @keyframes safeGlow {
      0%, 100% { box-shadow: 0 0 5px rgba(76, 175, 80, 0.2); }
      50% { box-shadow: 0 0 15px rgba(76, 175, 80, 0.5); }
    }

    @keyframes dangerBlink {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.85; transform: scale(1.02); }
    }

    @keyframes numberPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .dangerCard {
      animation: dangerShakeGlow 0.6s infinite alternate !important;
      border: 2px solid #ff1744;
    }

    @keyframes dangerShakeGlow {
      0% { box-shadow: 0 0 15px rgba(255, 23, 68, 0.4); }
      100% { box-shadow: 0 0 35px rgba(255, 23, 68, 0.9); }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🔥 LPG GAS DETECTOR</h1>
    <p>Smart IoT Safety & Monitoring Dashboard</p>
  </div>

  <div class="container">

    <div class="card" id="mainCard">

      <!-- LIVE DISPLAY BADGE -->
      <div class="live-display-bar">
        <div class="live-status-indicator">
          <span class="pulse-dot"></span> LIVE DASHBOARD
        </div>
        <button class="fullscreen-btn" onclick="toggleFullScreen()">
          🖥️ Fullscreen
        </button>
      </div>

      <div id="status" class="safe">
        🟢 SAFE
      </div>

      <div class="gas">
        Gas Level: <span id="gasValue">39</span>
      </div>

      <!-- GAS PROGRESS BAR -->
      <div class="gasBarContainer">
        <div id="gasBar"></div>
      </div>

      <div class="info-grid">
        <div class="info">🔊 Buzzer: <b id="buzzer">OFF</b></div>
        <div class="info">🔴 Red LED: <b id="red">OFF</b></div>
        <div class="info">🟢 Green LED: <b id="green">ON</b></div>
        <div class="info">⚙️ Servo: <b id="servo">0°</b></div>
      </div>

      <div class="btn-group">
        <button class="sms" onclick="sendSMS()">💬 SEND SMS</button>
        <button class="call" onclick="makeCall()">📞 EMERGENCY CALL</button>
        <button class="connect-btn" onclick="connectArduino()">🔌 CONNECT ARDUINO</button>
      </div>

      <p id="statusText" style="font-size:13px; color:#666; margin-top:12px; font-weight: 500;">
        Status: Disconnected ⚪
      </p>

      <div id="lastUpdated" class="last-updated">⏱️ Last Synced: Just now</div>

    </div>

  </div>

  <script>
    let smsSent = false;

    /* TWILIO SMS CONFIGURATION (Apni ID yahan bharein) */
    const TWILIO_ACCOUNT_SID = "YOUR_TWILIO_ACCOUNT_SID";
    const TWILIO_AUTH_TOKEN = "YOUR_TWILIO_AUTH_TOKEN";
    const TWILIO_PHONE_NUMBER = "+1234567890"; 
    const MY_PHONE_NUMBER = "+91XXXXXXXXXX"; 

    /* FULLSCREEN TOGGLE */
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    /* AUTO SMS FUNCTION */
    function triggerAutoSMS(gasValue) {
      if (smsSent) return;

      const messageBody = `🚨 ALERT! LPG Gas Leakage Detected! Current Gas Level: ${gasValue}`;

      fetch(`https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Messages.json`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'Authorization': 'Basic ' + btoa(`${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}`)
        },
        body: new URLSearchParams({
          'To': MY_PHONE_NUMBER,
          'From': TWILIO_PHONE_NUMBER,
          'Body': messageBody
        })
      })
      .then(response => response.json())
      .then(data => {
        console.log("SMS Sent:", data);
        alert("🚨 EMERGENCY ALERT: SMS Sent to registered phone number!");
        smsSent = true;
      })
      .catch(error => {
        console.error("SMS Error:", error);
      });
    }

    function sendSMS() {
      const currentGas = document.getElementById("gasValue").innerText;
      triggerAutoSMS(currentGas);
    }

    function makeCall() {
      alert("📞 Emergency Call Initiated!");
      window.location.href = `tel:${MY_PHONE_NUMBER}`;
    }

    /* ARDUINO SERIAL */
    let port;
    let reader;
    let isConnected = false;

    async function connectArduino() {
      const status = document.getElementById("statusText");

      if (!("serial" in navigator)) {
        alert("Aapka browser Web Serial API support nahi karta! Google Chrome ya Edge use karein.");
        return;
      }

      if (!isConnected) {
        try {
          port = await navigator.serial.requestPort();
          await port.open({ baudRate: 9600 });
          isConnected = true;
          status.innerText = "Status: Connected via USB 🟢";
          status.style.color = "#2e7d32";
          readSerialData();
        } catch (err) {
          status.innerText = "Status: Connection Failed / Cancelled 🔴";
          status.style.color = "#d32f2f";
        }
      } else {
        if (reader) await reader.cancel();
        if (port) await port.close();
        isConnected = false;
        status.innerText = "Status: Disconnected ⚪";
        status.style.color = "#666";
      }
    }

    /* READ ARDUINO DATA */
    async function readSerialData() {
      const decoder = new TextDecoderStream();
      const inputDone = port.readable.pipeTo(decoder.writable);
      const inputStream = decoder.readable;
      reader = inputStream.getReader();
      let buffer = "";

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            reader.releaseLock();
            break;
          }

          if (value) {
            buffer += value;
            let lines = buffer.split("\n");
            buffer = lines.pop();

            for (let line of lines) {
              let trimmedVal = line.trim();
              if (trimmedVal !== "" && !isNaN(trimmedVal)) {
                updateGas(Number(trimmedVal));
              }
            }
          }
        }
      } catch (err) {
        console.error("Read Error:", err);
      }
    }

    /* UPDATE GAS STATUS & LIVE SYNC */
    function updateGas(value) {
      const gasValue = document.getElementById("gasValue");
      const gasBar = document.getElementById("gasBar");
      const status = document.getElementById("status");
      const card = document.getElementById("mainCard");

      gasValue.innerText = value;

      let percentage = (value / 1023) * 100;
      if (percentage > 100) percentage = 100;

      gasBar.style.width = percentage + "%";

      if (value >= 300) {
        /* DANGER */
        gasBar.style.background = "linear-gradient(90deg, #f44336, #e53935)";
        gasBar.style.boxShadow = "0 0 12px rgba(244, 67, 54, 0.8)";
        
        status.innerHTML = "🚨 LPG GAS DETECTED!";
        status.className = "danger";
        card.classList.add("dangerCard");

        document.getElementById("buzzer").innerText = "ON";
        document.getElementById("red").innerText = "ON";
        document.getElementById("green").innerText = "OFF";
        document.getElementById("servo").innerText = "180°";

        triggerAutoSMS(value);

      } else {
        /* SAFE */
        gasBar.style.background = "linear-gradient(90deg, #4caf50, #81c784)";
        gasBar.style.boxShadow = "0 0 10px rgba(76, 175, 80, 0.5)";

        status.innerHTML = "🟢 SAFE";
        status.className = "safe";
        card.classList.remove("dangerCard");

        document.getElementById("buzzer").innerText = "OFF";
        document.getElementById("red").innerText = "OFF";
        document.getElementById("green").innerText = "ON";
        document.getElementById("servo").innerText = "0°";

        smsSent = false;
      }

      /* UPDATE TIMESTAMP */
      const now = new Date();
      document.getElementById("lastUpdated").innerText = "⏱️ Last Synced: " + now.toLocaleTimeString();
    }

    /* INITIAL VALUE */
    updateGas(39);
  </script>

<!-- Connect Button -->
<button id="connectBtn" onclick="connectArduino()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
  Connect Arduino
</button>

<!-- Live Status Display -->
<h3 id="statusText">Status: Not Connected</h3>

<script>
  let port;
  let reader;
  let smsSent = false; // Bar-bar SMS jane se rokne ke liye

  // Fast2SMS API Details
  const apiKey = "YOUR_FAST2SMS_API_KEY"; // Yahan apni Fast2SMS API Key daalein
  const mobileNumber = "YOUR_MOBILE_NUMBER"; // Yahan apna 10-digit mobile number daalein

  // 1. Arduino ko Browser se connect karne ka function
  async function connectArduino() {
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 9600 });
      document.getElementById("statusText").innerText = "Status: Connected to Arduino";
      readSerialData();
    } catch (err) {
      console.error("Connection Failed:", err);
      alert("Arduino Connect Nahi Hua: " + err.message);
    }
  }

  // 2. Arduino se continuous data read karne ka function
  async function readSerialData() {
    const textDecoder = new TextDecoderStream();
    const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
    reader = textDecoder.readable.getReader();

    while (true) {
      const { value, done } = await reader.read();
      if (done) {
        reader.releaseLock();
        break;
      }
      if (value) {
        let serialMessage = value.trim();
        console.log("Arduino Output:", serialMessage);

        // Agar Arduino se "GAS_DETECTED" ka message aata hai
        if (serialMessage.includes("GAS_DETECTED")) {
          document.getElementById("statusText").innerText = "Status: ⚠️ GAS LEAKAGE DETECTED!";
          document.getElementById("statusText").style.color = "red";

          // Pehli baar gas detect hone par SMS bhejega
          if (!smsSent) {
            sendSMSAlert();
            smsSent = true; 
          }
        } else if (serialMessage.includes("GAS_NORMAL")) {
          document.getElementById("statusText").innerText = "Status: ✅ Normal";
          document.getElementById("statusText").style.color = "green";
          smsSent = false; // Reset taaki agli baar dubara SMS ja sake
        }
      }
    }
  }

  // 3. Fast2SMS API se SMS bhejne ka function
  function sendSMSAlert() {
    const url = `https://www.fast2sms.com/dev/bulkV2?authorization=${apiKey}&route=q&message=WARNING!%20LPG%20Gas%20Leakage%20Detected&flash=0&numbers=${mobileNumber}`;

    fetch(url, { method: "GET" })
      .then(response => response.json())
      .then(data => {
        console.log("SMS Status:", data);
        if(data.return === true) {
          alert("SMS Alert Sent Successfully!");
        } else {
          alert("SMS Send Failed: " + data.message);
        }
      })
      .catch(error => {
        console.error("Error sending SMS:", error);
      });
  }
</script></body>
</html>
