<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPG Gas Status Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #333;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      color: white;
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 1px;
    }

    .header p {
      margin: 5px 0 0;
      opacity: 0.8;
      font-size: 13px;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 460px;
      width: 92%;
      margin: 20px auto;
      padding: 5px;
    }

    /* CARD */
    .card {
      background: rgba(255, 255, 255, 0.96);
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      position: relative;
    }

    /* LIVE DISPLAY BAR */
    .live-display-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding: 8px 14px;
      background: #f0f4f8;
      border-radius: 10px;
    }

    .live-status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 13px;
      color: #0288d1;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #00E676;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    .fullscreen-btn {
      width: auto !important;
      padding: 5px 10px !important;
      font-size: 12px !important;
      background: #333 !important;
      color: white !important;
      border-radius: 6px !important;
      margin: 0 !important;
    }

    /* STATUS */
    #status {
      font-size: 24px;
      font-weight: 800;
      margin: 12px 0;
      padding: 10px;
      border-radius: 12px;
      transition: all 0.4s ease;
    }

    .safe {
      color: #2e7d32;
      background: rgba(76, 175, 80, 0.12);
    }

    .danger {
      color: #d32f2f;
      background: rgba(244, 67, 54, 0.15);
    }

    /* GAS VALUE */
    .gas {
      font-size: 22px;
      font-weight: 700;
      color: #444;
      margin: 10px 0;
    }

    #gasValue {
      display: inline-block;
      font-size: 36px;
      color: #111;
      font-weight: 900;
    }

    /* GAS BAR */
    .gasBarContainer {
      width: 100%;
      height: 22px;
      background: #e0e0e0;
      border-radius: 20px;
      margin: 15px 0;
      overflow: hidden;
      padding: 3px;
    }

    #gasBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4caf50, #81c784);
      border-radius: 15px;
      transition: width 0.4s ease;
    }

    /* INFO GRID */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 15px 0;
    }

    .info {
      font-size: 14px;
      font-weight: 600;
      padding: 10px 8px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 10px;
    }

    /* BUTTONS */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    .sms { background: linear-gradient(135deg, #2196F3, #1e88e5); color: white; }
    .call { background: linear-gradient(135deg, #4CAF50, #43a047); color: white; }
    .connect-btn { background: linear-gradient(135deg, #ff9800, #fb8c00); color: white; }

    .last-updated {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
      font-weight: 500;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(0, 230, 118, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🔥 LPG GAS DETECTOR</h1>
    <p>Smart IoT Safety & Monitoring Dashboard</p>
  </div>

  <div class="container">
    <div class="card" id="mainCard">

      <div class="live-display-bar">
        <div class="live-status-indicator">
          <span class="pulse-dot"></span> LIVE DASHBOARD
        </div>
        <button class="fullscreen-btn" onclick="toggleFullScreen()">🖥️ Fullscreen</button>
      </div>

      <div id="status" class="safe">
        🟢 SAFE
      </div>

      <div class="gas">
        Gas Level: <span id="gasValue">0</span>
      </div>

      <div class="gasBarContainer">
        <div id="gasBar"></div>
      </div>

      <div class="info-grid">
        <div class="info">🔊 Buzzer: <b id="buzzer">OFF</b></div>
        <div class="info">🔴 Red LED: <b id="red">OFF</b></div>
        <div class="info">🟢 Green LED: <b id="green">ON</b></div>
        <div class="info">⚙️ Servo: <b id="servo">0°</b></div>
      </div>

      <div class="btn-group">
        <button class="sms" onclick="viewSMS()">💭 VIEW SMS</button>
        <button class="call" onclick="makeCall()">📞 EMERGENCY CALL</button>
        <button class="connect-btn" onclick="connectArduino()">🔌 CONNECT ARDUINO</button>
      </div>

      <p id="statusText" style="font-size:13px; color:#666; margin-top:12px; font-weight: 500;">
        Status: Disconnected ⚪
      </p>

      <div id="lastUpdated" class="last-updated">⏱️ Last Synced: Just now</div>

    </div>
  </div>

  <script>
    let port;
    let reader;
    let isConnected = false;
    let smsLogs = [];
    let smsCount = 0;

    const MY_PHONE_NUMBER = "+919074289981";

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    function viewSMS() {
      if (smsLogs.length === 0) {
        alert("📩 VIEW SMS LOGS:\n\nAbhi tak koi SMS trigger nahi hua hai.");
      } else {
        let logMessage = "📩 RECEIVED SMS ALERTS LOGS:\n\n";
        smsLogs.forEach((log, index) => {
          logMessage += `${index + 1}. ${log}\n\n`;
        });
        alert(logMessage);
      }
    }

    function makeCall() {
      alert("📞 Emergency Call Initiated!");
      window.location.href = `tel:${MY_PHONE_NUMBER}`;
    }

    async function connectArduino() {
      const status = document.getElementById("statusText");

      if (!("serial" in navigator)) {
        alert("Aapka browser Web Serial API support nahi karta! Google Chrome ya Edge use karein.");
        return;
      }

      if (!isConnected) {
        try {
          port = await navigator.serial.requestPort();
          await port.open({ baudRate: 9600 });
          isConnected = true;
          status.innerText = "Status: Connected via USB 🟢";
          status.style.color = "#2e7d32";
          readSerialData();
        } catch (err) {
          status.innerText = "Status: Connection Failed / Cancelled 🔴";
          status.style.color = "#d32f2f";
        }
      } else {
        if (reader) await reader.cancel();
        if (port) await port.close();
        isConnected = false;
        status.innerText = "Status: Disconnected ⚪";
        status.style.color = "#666";
      }
    }

    async function readSerialData() {
      const decoder = new TextDecoderStream();
      port.readable.pipeTo(decoder.writable);
      reader = decoder.readable.getReader();
      let buffer = "";

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          if (value) {
            buffer += value;
            let lines = buffer.split("\n");
            buffer = lines.pop();

            for (let line of lines) {
              let trimmedVal = line.trim();
              // Handle both "GAS:123" format and raw number format
              if (trimmedVal.startsWith("GAS:")) {
                let val = parseInt(trimmedVal.replace("GAS:", ""));
                if (!isNaN(val)) updateGas(val);
              } else if (!isNaN(trimmedVal) && trimmedVal !== "") {
                updateGas(Number(trimmedVal));
              }
            }
          }
        }
      } catch (err) {
        console.error("Read Error:", err);
      } finally {
        reader.releaseLock();
      }
    }

    function updateGas(value) {
      const gasValue = document.getElementById("gasValue");
      const gasBar = document.getElementById("gasBar");
      const status = document.getElementById("status");

      gasValue.innerText = value;

      let percentage = (value / 1023) * 100;
      if (percentage > 100) percentage = 100;
      gasBar.style.width = percentage + "%";

      if (value >= 300) {
        gasBar.style.background = "linear-gradient(90deg, #f44336, #e53935)";
        status.innerHTML = "🚨 LPG GAS DETECTED!";
        status.className = "danger";

        document.getElementById("buzzer").innerText = "ON";
        document.getElementById("red").innerText = "ON";
        document.getElementById("green").innerText = "OFF";
        document.getElementById("servo").innerText = "90°"; // Updated to 90 degrees
      } else {
        gasBar.style.background = "linear-gradient(90deg, #4caf50, #81c784)";
        status.innerHTML = "🟢 SAFE";
        status.className = "safe";

        document.getElementById("buzzer").innerText = "OFF";
        document.getElementById("red").innerText = "OFF";
        document.getElementById("green").innerText = "ON";
        document.getElementById("servo").innerText = "0°";
      }

      const now = new Date();
      document.getElementById("lastUpdated").innerText = "⏱️ Last Synced: " + now.toLocaleTimeString();
    }
  </script>
</body>
</html>
